[project]
name = "grant-panel-swarm"
version = "0.1.0"
description = "Grant-panel swarm for studying an animal-welfare model organism"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
data = [
    "huggingface-hub>=1.33.0",
    "pymupdf>=1.28.2",
    "tokenizers>=0.23.2",
]
